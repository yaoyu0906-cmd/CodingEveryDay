<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rate My Project - CodingEveryday</title>
<style>
body{margin:0;font-family:Arial;background:url("../indexbg.jpg") no-repeat center/cover;min-height:100vh;color:white;}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);}
.logo{font-size:22px;font-weight:bold;}
.container{padding:40px 30px;max-width:700px;margin:0 auto;}
h2{margin-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,0.9),0 0 20px rgba(0,0,0,0.7);}
.subtitle{color:#ddd;font-size:14px;margin-bottom:24px;text-shadow:0 1px 6px rgba(0,0,0,0.9);background:rgba(0,0,0,0.35);display:inline-block;padding:4px 10px;border-radius:6px;}
.box{background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);border-radius:15px;padding:24px;margin-bottom:20px;}
.card{background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);border-radius:12px;padding:20px;margin-bottom:16px;}
input[type=text],textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.2);border-radius:10px;color:white;font-size:14px;padding:12px;outline:none;margin-bottom:12px;font-family:Arial;}
input[type=text]:focus,textarea:focus{border-color:white;}
textarea{resize:vertical;}
.btn{padding:8px 20px;background:black;color:white;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;position:relative;z-index:1;overflow:hidden;margin-right:6px;}
.btn-sm{padding:4px 12px;background:black;color:white;border:none;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;position:relative;z-index:1;overflow:hidden;margin-right:4px;}
button:hover{color:black;}
button:after{content:"";background:white;position:absolute;z-index:-1;left:-20%;right:-20%;top:0;bottom:0;transform:skewX(-45deg) scale(0,1);transition:all 0.5s;}
button:hover:after{transform:skewX(-45deg) scale(1,1);}
.vote-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.score{font-size:16px;font-weight:bold;}
.vote-btn.active-up,.vote-btn.active-down{background:white!important;color:black!important;}
.empty{color:#aaa;text-align:center;padding:20px;}
.guest-notice{background:rgba(255,200,0,0.12);border:1px solid rgba(255,200,0,0.3);border-radius:8px;padding:10px 16px;font-size:13px;color:#ffd966;margin-bottom:20px;}
.comment-section{margin-top:14px;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;}
.comment{background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.comment-author{font-size:12px;font-weight:bold;color:#aaa;margin-bottom:4px;}
.comment-text{font-size:13px;color:#ddd;word-break:break-word;}
.comment-vote{display:flex;align-items:center;gap:8px;margin-top:6px;}
.comment-input{display:flex;gap:8px;margin-top:10px;}
.comment-input input{margin-bottom:0;flex:1;}
</style>
</head>
<body>
<div class="navbar">
  <div class="logo">CodingEveryday</div>
  <button class="btn" onclick="location.href='/main'">Home</button>
</div>
<div class="container">
  <h2>🚀 Rate My Project</h2>
  <div class="subtitle">Share your project and get real feedback</div>
  <div id="guestNotice" class="guest-notice" style="display:none;">👋 You're viewing as a guest. <a href="/login" style="color:#ffd966;">Log in</a> to vote, comment or submit.</div>
  <div class="box" id="submitBox">
    <h3 style="margin:0 0 16px 0;font-size:16px;">Submit Your Project</h3>
    <input type="text" id="projTitle" placeholder="Project name">
    <input type="text" id="projLink" placeholder="Link (GitHub, live demo...)">
    <textarea id="projDesc" rows="3" placeholder="What does your project do?"></textarea>
    <button class="btn" onclick="submitProject()">Submit</button>
  </div>
  <div id="projectsList"><div class="empty">Loading...</div></div>
</div>
<script src="../js/main.js"></script>
<script>
const API="https://codingeveryday-api.onrender.com";
const ME=getUsername();
const LOGGEDIN=ME&&ME!=="Guest";
if(!LOGGEDIN){document.getElementById("guestNotice").style.display="block";document.getElementById("submitBox").style.display="none";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

async function loadProjects(){
  const list=document.getElementById("projectsList");
  try{
    const res=await fetch(API+"/projects?username="+encodeURIComponent(ME));
    const data=await res.json();
    if(!data.projects||!data.projects.length){list.innerHTML='<div class="empty">No projects yet. Be the first!</div>';return;}
    list.innerHTML=data.projects.map(p=>`
      <div class="card">
        <div style="font-size:17px;font-weight:bold;margin-bottom:4px;">${esc(p.title)}</div>
        ${p.link?`<div style="font-size:12px;margin-bottom:6px;"><a href="${esc(p.link)}" target="_blank" style="color:#aaa;">🔗 ${esc(p.link)}</a></div>`:""}
        <div style="font-size:13px;color:#ccc;margin-bottom:8px;">${esc(p.desc)}</div>
        <div style="font-size:12px;color:#777;">by <strong>${esc(p.author)}</strong></div>
        <div class="vote-row">
          ${LOGGEDIN?`<button class="btn btn-sm vote-btn ${p.uservote===1?"active-up":""}" onclick="voteProject(${p.id},1)">👍</button>`:`<button class="btn btn-sm" onclick="noAuth()">👍</button>`}
          <span class="score">${p.votes}</span>
          ${LOGGEDIN?`<button class="btn btn-sm vote-btn ${p.uservote===-1?"active-down":""}" onclick="voteProject(${p.id},-1)">👎</button>`:`<button class="btn btn-sm" onclick="noAuth()">👎</button>`}
        </div>
        <div class="comment-section">
          <div id="comments-${p.id}"></div>
          ${LOGGEDIN?`<div class="comment-input"><input type="text" id="ci-${p.id}" placeholder="Write a comment..."><button class="btn btn-sm" onclick="postComment(${p.id})">Post</button></div>`:`<div style="font-size:12px;color:#aaa;margin-top:8px;"><a href="/login" style="color:#ffd966;">Log in</a> to comment</div>`}
        </div>
      </div>`).join("");
    data.projects.forEach(p=>loadComments(p.id));
  }catch(e){list.innerHTML='<div class="empty">Failed to load.</div>';}
}

async function loadComments(id){
  const res=await fetch(API+"/projects/"+id+"/comments?username="+encodeURIComponent(ME));
  const data=await res.json();
  const el=document.getElementById("comments-"+id);
  if(!el)return;
  if(!data.comments||!data.comments.length){el.innerHTML='<div style="font-size:12px;color:#555;margin-bottom:6px;">No comments yet.</div>';return;}
  el.innerHTML=data.comments.map(c=>`
    <div class="comment">
      <div class="comment-author">${esc(c.author)}</div>
      <div class="comment-text">${esc(c.content)}</div>
      <div class="comment-vote">
        ${LOGGEDIN?`<button class="btn btn-sm vote-btn ${c.uservote===1?"active-up":""}" onclick="voteComment(${id},${c.id},1)">👍</button>`:`<button class="btn btn-sm" onclick="noAuth()">👍</button>`}
        <span style="font-size:13px;font-weight:bold;">${c.votes}</span>
        ${LOGGEDIN?`<button class="btn btn-sm vote-btn ${c.uservote===-1?"active-down":""}" onclick="voteComment(${id},${c.id},-1)">👎</button>`:`<button class="btn btn-sm" onclick="noAuth()">👎</button>`}
      </div>
    </div>`).join("");
}

async function submitProject(){
  const title=document.getElementById("projTitle").value.trim();
  const link=document.getElementById("projLink").value.trim();
  const desc=document.getElementById("projDesc").value.trim();
  if(!title||!desc){alert("Fill in title and description.");return;}
  const r=await fetch(API+"/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,link,desc,username:ME})});
  const d=await r.json();
  if(d.status==="ok"){document.getElementById("projTitle").value="";document.getElementById("projLink").value="";document.getElementById("projDesc").value="";loadProjects();}
  else alert(d.message);
}

async function voteProject(id,val){
  await fetch(API+"/projects/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,val,username:ME})});
  loadProjects();
}

async function postComment(id){
  const input=document.getElementById("ci-"+id);
  const content=input.value.trim();
  if(!content)return;
  await fetch(API+"/projects/"+id+"/comments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content,username:ME})});
  input.value="";
  loadComments(id);
}

async function voteComment(projId,commentId,val){
  await fetch(API+"/projects/comments/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:commentId,val,username:ME})});
  loadComments(projId);
}

function noAuth(){alert("Please log in to interact.");}
loadProjects();
</script>
</body>
</html>
