<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: url("../indexbg.jpg") no-repeat center/cover;
    height: 100vh;
    color: white;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.nav-btns {
    display: flex;
    gap: 10px;
    align-items: center;
}

.container {
    height: calc(100vh - 70px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.profile-card {
    width: 400px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    border-radius: 15px;
    padding: 30px;
}

.profile-header {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.label {
    color: #aaa;
}

.value {
    font-weight: bold;
}

.btn {
    width: 6.5em;
    height: 2.3em;
    margin-top: 0;
    background: black;
    color: white;
    border: none;
    border-radius: 0.625em;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    z-index: 1;
    overflow: hidden;
}

.btn-sm {
    width: auto;
    padding: 4px 12px;
    height: 1.8em;
    margin-top: 0;
    font-size: 13px;
    background: black;
    color: white;
    border: none;
    border-radius: 0.5em;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    z-index: 1;
    overflow: hidden;
}

button:hover { color: black; }

button:after {
    content: "";
    background: white;
    position: absolute;
    z-index: -1;
    left: -20%;
    right: -20%;
    top: 0;
    bottom: 0;
    transform: skewX(-45deg) scale(0, 1);
    transition: all 0.5s;
}

button:hover:after {
    transform: skewX(-45deg) scale(1, 1);
}

.edit-input {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    color: white;
    font-size: 14px;
    padding: 4px 8px;
    outline: none;
    width: 140px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">CodingEveryday</div>
    <div class="nav-btns">
        <button class="btn" onclick="goMain()">Home</button>
        <button class="btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="profile-card">

        <div class="profile-header">Profile</div>

        <div class="row">
            <div class="label">Name</div>
            <div class="value" id="nameDisplay"></div>
        </div>

        <div class="row">
            <div class="label">Likes</div>
            <div class="value" id="likesCount">Loading...</div>
        </div>

        <div class="row">
            <div class="label">Uploads</div>
            <div class="value" id="uploadCount">Loading...</div>
        </div>

        <button class="btn" onclick="logout()">Logout</button>

    </div>
</div>

<script src="../js/main.js"></script>
<script>
    const username = getUsername();
    document.getElementById("nameDisplay").textContent = username;

    // Fetch stats
    const API = "https://codingeveryday-api.onrender.com";
    async function loadStats() {
        try {
            const [ideas, projects, qa, upgrades] = await Promise.all([
                fetch(API + "/ideas?username=" + encodeURIComponent(username)).then(r=>r.json()),
                fetch(API + "/projects?username=" + encodeURIComponent(username)).then(r=>r.json()),
                fetch(API + "/qa?username=" + encodeURIComponent(username)).then(r=>r.json()),
                fetch(API + "/upgrades?username=" + encodeURIComponent(username)).then(r=>r.json()),
            ]);

            const mine = (arr) => arr.filter(x => x.author === username);

            const myIdeas    = mine(ideas.ideas    || []);
            const myProjects = mine(projects.projects || []);
            const myQA       = mine(qa.questions   || []);
            const myUpgrades = mine(upgrades.upgrades || []);

            // total likes = sum of votes on all my posts
            const totalLikes =
                myIdeas.reduce((s,x)=>s+x.votes,0) +
                myProjects.reduce((s,x)=>s+x.votes,0) +
                myQA.reduce((s,x)=>s+x.votes,0) +
                myUpgrades.reduce((s,x)=>s+x.votes,0);

            // total uploads = ideas + projects + qa + upgrades posted
            const totalUploads = myIdeas.length + myProjects.length + myQA.length + myUpgrades.length;

            document.getElementById("likesCount").textContent = totalLikes;
            document.getElementById("uploadCount").textContent = totalUploads;
        } catch(e) {
            document.getElementById("likesCount").textContent = "—";
            document.getElementById("uploadCount").textContent = "—";
        }
    }
    loadStats();


</script>
</body>
</html>
