<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dev Tools - CodingEveryday</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden; /* prevent whole page scrolling */
    font-family: Arial;
    background: url("../indexbg.jpg") no-repeat center/cover;
    color: white;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
}
.logo { font-size: 22px; font-weight: bold; }

.page-body {
    height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    padding: 28px 30px 16px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
}

.page-header {
    flex-shrink: 0;
}

h2 {
    margin: 0 0 4px 0;
    font-size: 26px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.tabs {
    display: flex;
    gap: 8px;
    margin: 16px 0 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
}

.tab {
    padding: 7px 16px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: white;
    transition: 0.2s;
    white-space: nowrap;
}
.tab.active, .tab:hover {
    background: rgba(255,255,255,0.15);
    border-color: white;
}

/* This is the scrollable area — NOT the whole page */
.tool-area {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
}

.tool-area::-webkit-scrollbar { width: 6px; }
.tool-area::-webkit-scrollbar-track { background: transparent; }
.tool-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

.tool-panel {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    border-radius: 15px;
    padding: 22px;
    display: none;
}
.tool-panel.active { display: block; }

textarea, input[type=text] {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: white;
    font-size: 14px;
    padding: 12px;
    font-family: monospace;
    outline: none;
    resize: vertical;
}
textarea:focus, input[type=text]:focus { border-color: white; }

.output {
    margin-top: 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 12px;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 60px;
    color: #ccc;
}

.btn {
    margin-top: 10px;
    margin-right: 6px;
    padding: 7px 18px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    z-index: 1;
    overflow: hidden;
}
button:hover { color: black; }
button:after {
    content: "";
    background: white;
    position: absolute;
    z-index: -1;
    left: -20%; right: -20%; top: 0; bottom: 0;
    transform: skewX(-45deg) scale(0,1);
    transition: all 0.5s;
}
button:hover:after { transform: skewX(-45deg) scale(1,1); }

label {
    font-size: 13px;
    color: #aaa;
    display: block;
    margin-bottom: 6px;
    margin-top: 12px;
}
label:first-child { margin-top: 0; }

.color-preview {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    margin-top: 10px;
    display: inline-block;
    vertical-align: middle;
    margin-left: 10px;
}
</style>
</head>
<body>

<div class="navbar">
    <div class="logo">CodingEveryday</div>
    <button class="btn" style="margin-top:0" onclick="location.href='/main'">Home</button>
</div>

<div class="page-body">
    <div class="page-header">
        <h2>🛠️ Dev Tools</h2>

        <div class="tabs">
            <div class="tab active" onclick="showTab('json', this)">JSON Formatter</div>
            <div class="tab" onclick="showTab('html', this)">HTML Formatter</div>
            <div class="tab" onclick="showTab('regex', this)">Regex Tester</div>
            <div class="tab" onclick="showTab('color', this)">Color Converter</div>
            <div class="tab" onclick="showTab('base64', this)">Base64</div>
            <div class="tab" onclick="showTab('case', this)">Case Converter</div>
        </div>
    </div>

    <div class="tool-area">

        <!-- JSON -->
        <div class="tool-panel active" id="tab-json">
            <label>Paste JSON</label>
            <textarea id="jsonInput" rows="7" placeholder='{"key": "value"}'></textarea>
            <button class="btn" onclick="formatJSON()">Format</button>
            <button class="btn" onclick="minifyJSON()">Minify</button>
            <div class="output" id="jsonOutput">Output will appear here...</div>
        </div>

        <!-- HTML Formatter -->
        <div class="tool-panel" id="tab-html">
            <label>Paste HTML</label>
            <textarea id="htmlInput" rows="7" placeholder="<div><p>Hello</p></div>"></textarea>
            <button class="btn" onclick="formatHTML()">Format</button>
            <button class="btn" onclick="minifyHTML()">Minify</button>
            <div class="output" id="htmlOutput">Output will appear here...</div>
        </div>

        <!-- Regex -->
        <div class="tool-panel" id="tab-regex">
            <label>Regex Pattern</label>
            <input type="text" id="regexPattern" placeholder="e.g. \d+">
            <label style="margin-top:10px;">Flags (optional)</label>
            <input type="text" id="regexFlags" placeholder="g, i, m ...">
            <label style="margin-top:10px;">Test String</label>
            <textarea id="regexInput" rows="5" placeholder="Paste your text here..."></textarea>
            <button class="btn" onclick="testRegex()">Test</button>
            <div class="output" id="regexOutput">Matches will appear here...</div>
        </div>

        <!-- Color -->
        <div class="tool-panel" id="tab-color">
            <label>Enter HEX color</label>
            <div>
                <input type="text" id="colorInput" placeholder="#ff6b6b" style="width:calc(100% - 70px);display:inline-block;vertical-align:middle;">
                <div class="color-preview" id="colorPreview"></div>
            </div>
            <button class="btn" onclick="convertColor()">Convert</button>
            <div class="output" id="colorOutput">RGB, HSL and CSS variable will appear here...</div>
        </div>

        <!-- Base64 -->
        <div class="tool-panel" id="tab-base64">
            <label>Text or Base64</label>
            <textarea id="b64Input" rows="5" placeholder="Enter text or base64..."></textarea>
            <button class="btn" onclick="encodeB64()">Encode</button>
            <button class="btn" onclick="decodeB64()">Decode</button>
            <div class="output" id="b64Output">Output will appear here...</div>
        </div>

        <!-- Case -->
        <div class="tool-panel" id="tab-case">
            <label>Input Text</label>
            <textarea id="caseInput" rows="4" placeholder="Enter text..."></textarea>
            <button class="btn" onclick="convertCase('camel')">camelCase</button>
            <button class="btn" onclick="convertCase('snake')">snake_case</button>
            <button class="btn" onclick="convertCase('kebab')">kebab-case</button>
            <button class="btn" onclick="convertCase('upper')">UPPER</button>
            <button class="btn" onclick="convertCase('title')">Title Case</button>
            <div class="output" id="caseOutput">Output will appear here...</div>
        </div>

    </div>
</div>

<script src="../js/main.js"></script>
<script>
function showTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    // scroll tool area back to top on tab switch
    document.querySelector('.tool-area').scrollTop = 0;
}

function formatJSON() {
    try {
        const parsed = JSON.parse(document.getElementById('jsonInput').value);
        document.getElementById('jsonOutput').textContent = JSON.stringify(parsed, null, 2);
    } catch(e) { document.getElementById('jsonOutput').textContent = 'Error: ' + e.message; }
}
function minifyJSON() {
    try {
        const parsed = JSON.parse(document.getElementById('jsonInput').value);
        document.getElementById('jsonOutput').textContent = JSON.stringify(parsed);
    } catch(e) { document.getElementById('jsonOutput').textContent = 'Error: ' + e.message; }
}

function formatHTML() {
    const raw = document.getElementById('htmlInput').value;
    let indent = 0;
    const tab = '  ';
    const selfClosing = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
    const result = [];
    const tokens = raw.match(/<[^>]+>|[^<]+/g) || [];
    tokens.forEach(token => {
        const trimmed = token.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('</')) {
            indent = Math.max(0, indent - 1);
            result.push(tab.repeat(indent) + trimmed);
        } else if (trimmed.startsWith('<') && !trimmed.startsWith('<!--')) {
            result.push(tab.repeat(indent) + trimmed);
            const tag = (trimmed.match(/^<([a-z0-9-]+)/i) || [])[1] || '';
            if (!selfClosing.test(tag) && !trimmed.endsWith('/>')) indent++;
        } else {
            if (trimmed) result.push(tab.repeat(indent) + trimmed);
        }
    });
    document.getElementById('htmlOutput').textContent = result.join('\n');
}
function minifyHTML() {
    document.getElementById('htmlOutput').textContent =
        document.getElementById('htmlInput').value.replace(/\s+/g, ' ').replace(/> </g, '><').trim();
}

function testRegex() {
    try {
        const pattern = document.getElementById('regexPattern').value;
        const flags = document.getElementById('regexFlags').value;
        const text = document.getElementById('regexInput').value;
        const gFlags = flags.includes('g') ? flags : flags + 'g';
        const matches = [...text.matchAll(new RegExp(pattern, gFlags))];
        if (matches.length === 0) {
            document.getElementById('regexOutput').textContent = 'No matches found.';
        } else {
            document.getElementById('regexOutput').textContent =
                matches.length + ' match(es):\n' + matches.map(m => `"${m[0]}" at index ${m.index}`).join('\n');
        }
    } catch(e) { document.getElementById('regexOutput').textContent = 'Error: ' + e.message; }
}

function convertColor() {
    const hex = document.getElementById('colorInput').value.trim();
    const result = document.getElementById('colorOutput');
    const preview = document.getElementById('colorPreview');
    try {
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        const r1=r/255, g1=g/255, b1=b/255;
        const max=Math.max(r1,g1,b1), min=Math.min(r1,g1,b1);
        let h=0, s, l=(max+min)/2;
        if(max!==min){
            const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
            h=max===r1?((g1-b1)/d+(g1<b1?6:0)):max===g1?(b1-r1)/d+2:(r1-g1)/d+4;
            h=Math.round(h*60);
        } else s=0;
        s=Math.round(s*100); l=Math.round(l*100);
        preview.style.background = hex;
        result.textContent = `RGB:  rgb(${r}, ${g}, ${b})\nHSL:  hsl(${h}, ${s}%, ${l}%)\nCSS:  --color: ${hex};\nTailwind: [${hex}]`;
    } catch(e) { result.textContent = 'Invalid hex color. Try: #ff6b6b'; }
}

function encodeB64() {
    try { document.getElementById('b64Output').textContent = btoa(document.getElementById('b64Input').value); }
    catch(e) { document.getElementById('b64Output').textContent = 'Error: ' + e.message; }
}
function decodeB64() {
    try { document.getElementById('b64Output').textContent = atob(document.getElementById('b64Input').value); }
    catch(e) { document.getElementById('b64Output').textContent = 'Error: invalid base64'; }
}

function convertCase(type) {
    const text = document.getElementById('caseInput').value;
    const words = text.trim().split(/[\s_\-]+/);
    let out;
    if(type==='camel') out = words.map((w,i)=>i===0?w.toLowerCase():w[0].toUpperCase()+w.slice(1).toLowerCase()).join('');
    else if(type==='snake') out = words.map(w=>w.toLowerCase()).join('_');
    else if(type==='kebab') out = words.map(w=>w.toLowerCase()).join('-');
    else if(type==='upper') out = text.toUpperCase();
    else if(type==='title') out = words.map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' ');
    document.getElementById('caseOutput').textContent = out;
}
</script>
</body>
</html>
