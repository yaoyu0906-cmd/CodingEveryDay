<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Main</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial;
    background: url("indexbg.jpg") no-repeat center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* container */
.box {
    backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.6);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    color: white;
    width: 350px;
}

/* optional text styling */
h2 {
    margin-bottom: 10px;
}

p {
    color: #ccc;
}
</style>
</head>

<body>

<div class="box">
    <h2>Webpage under development</h2>
    <p>Please wait.</p>
</div>

</body>
</html>
